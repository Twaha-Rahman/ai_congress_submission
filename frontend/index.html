<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f5" />
    <script>
      // Apply the saved appearance before styles paint to avoid a light flash.
      (() => {
        let theme = "system";
        try {
          const saved = localStorage.getItem("meridian-theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch {}
        const resolved = theme === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : theme;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = theme;
        document.querySelector('meta[name="theme-color"]').content = resolved === "dark" ? "#1e1e20" : "#faf9f5";
      })();
    </script>
    <meta
      name="description"
      content="Meridian — investigate policy findings with their original evidence."
    />
    <link rel="icon" type="image/svg+xml" href="/meridian.svg" />
    <title>Findings · Meridian</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
