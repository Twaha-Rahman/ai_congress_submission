[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.1.0"
description = "Verifiable institutional memory backend: Dhaka/Frankfurt office nodes plus gateway"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.148.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "PyMuPDF==2.0",
    "cryptography==50.0.2",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["meridian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
